<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Dungeon Forge</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3b2a52"/>
      <stop offset="0.6" stop-color="#1e1530"/>
      <stop offset="1" stop-color="#0d0916"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="0.55" stop-color="#ff9d1c"/>
      <stop offset="1" stop-color="#ffd84a"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dde8"/>
      <stop offset="0.45" stop-color="#8f9bb0"/>
      <stop offset="1" stop-color="#4b556b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#c9822a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1024" height="1024" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- dungeon arch -->
    <path d="M232 880 V470 a280 280 0 0 1 560 0 V880 Z" fill="#120c1f" stroke="url(#rim)" stroke-width="22" stroke-linejoin="round"/>
    <path d="M286 880 V470 a226 226 0 0 1 452 0 V880 Z" fill="none" stroke="#5a4580" stroke-width="6" opacity="0.7"/>
    <ellipse cx="512" cy="560" rx="300" ry="260" fill="url(#glow)"/>
    <!-- flame -->
    <path d="M512 150 C 548 235 650 280 640 400 C 634 462 596 500 560 520 C 590 460 560 420 540 392 C 530 440 490 456 478 506 C 440 490 392 444 396 380 C 400 300 478 270 512 150 Z" fill="url(#flame)"/>
    <path d="M512 290 C 536 340 586 366 580 430 C 576 466 552 486 530 498 C 546 462 530 442 516 424 C 508 452 482 462 474 488 C 452 474 436 446 440 412 C 444 362 494 346 512 290 Z" fill="url(#flameInner)"/>
    <!-- sparks -->
    <g fill="#ffd84a">
      <circle cx="372" cy="360" r="9"/><circle cx="672" cy="330" r="7"/><circle cx="700" cy="440" r="5"/>
      <circle cx="338" cy="450" r="5"/><circle cx="612" cy="230" r="6"/>
    </g>
    <!-- anvil -->
    <path d="M232 584 H700 C 740 584 772 600 796 628 C 770 640 728 646 690 646 H650 C 650 690 668 716 704 740 V790 H320 V740 C 356 716 376 690 376 646 H340 C 290 646 252 624 232 584 Z" fill="url(#steel)" stroke="#2b3347" stroke-width="10" stroke-linejoin="round"/>
    <path d="M250 596 H700 C 728 596 754 606 774 622" fill="none" stroke="#f2f5fb" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <rect x="290" y="790" width="444" height="52" rx="14" fill="#3a4258" stroke="#2b3347" stroke-width="10"/>
    <!-- hammer -->
    <g transform="rotate(-32 300 470)">
      <rect x="280" y="360" width="26" height="250" rx="12" fill="#8a5a2b" stroke="#4a2f14" stroke-width="8"/>
      <rect x="214" y="318" width="158" height="76" rx="14" fill="url(#steel)" stroke="#2b3347" stroke-width="10"/>
      <rect x="226" y="330" width="134" height="12" rx="6" fill="#f2f5fb" opacity="0.7"/>
    </g>
  </g>
</svg>
